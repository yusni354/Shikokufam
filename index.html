<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Komunitas ID-JP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e6;--card:#fffdf8;--ink:#17324d;--mut:#6f7b86;--line:#e8e1d0;--acc:#2f8fc1;--g:linear-gradient(135deg,#4fb0d9,#2f86b8);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Ubuntu,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--g);color:#fff;border-radius:0 0 28px 28px;box-shadow:0 8px 22px rgba(47,134,184,.25);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{letter-spacing:.3px}
.logo{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--acc);display:grid;place-items:center;font-weight:700}
.ic{background:none;border:0;font-size:24px;color:inherit}
main{padding:16px 16px 110px;max-width:720px;margin:auto}
h1{font-size:26px;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 16px}
.warn{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:var(--ink);box-shadow:0 4px 16px rgba(47,134,184,.1)}
.card .e{width:54px;height:54px;border-radius:16px;background:#e3f1f8;display:grid;place-items:center;font-size:26px;flex:none}
.card b{display:block;font-size:17px}
.card small{color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(47,143,193,.18)}
select{-webkit-appearance:none;appearance:none;flex:1 1 40%;min-width:0;padding-right:40px;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%229%22 viewBox=%220 0 14 9%22%3E%3Cpath d=%22M1 1l6 6 6-6%22 fill=%22none%22 stroke=%22%232f8fc1%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/%3E%3C/svg%3E');background-repeat:no-repeat;background-position:right 14px center}
input[type=checkbox]{width:20px;height:20px;margin:0;flex:none;accent-color:var(--acc)}
.btn{background:var(--g);color:#fff;border:0;border-radius:999px;font-weight:700;padding:11px 18px;box-shadow:0 6px 16px rgba(47,134,184,.3)}
.btn.s{padding:6px 10px;background:none;color:var(--acc);border:2px solid var(--line);box-shadow:none;font-weight:600}
.fl{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.lb{display:block;font-size:14px;font-weight:600;margin-top:12px}
.lb input,.lb select,.lb textarea{display:block;width:100%;margin-top:4px;font-weight:400}
.tag{display:inline-block;font-size:12px;background:var(--line);border-radius:8px;padding:2px 8px;margin-left:6px}
.mrow{display:flex;align-items:center;gap:10px;padding:12px;border-top:2px solid var(--line)}
.mrow.hd{border-top:0;color:var(--mut);font-weight:600}
.mrow .btn.s{padding:6px 9px}
.av{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ok{background:#c9f7e3;color:#047857;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;margin:0}
.ok.off{background:var(--line);color:var(--mut)}
.dots{display:flex;gap:6px;margin:6px 0 14px}
.dots span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots span.on{background:var(--g)}
.nav{display:flex;gap:10px;margin:4px 0 24px}
.nav .btn{flex:1}
.stats{display:flex;background:var(--card);border-radius:20px;box-shadow:0 8px 24px rgba(47,134,184,.15);padding:14px 6px;margin-bottom:18px}
.stats div{flex:1;text-align:center}
.stats small{display:block;color:var(--mut);font-size:12px}
.stats b{font-size:22px;color:var(--acc)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9}
#dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--card);z-index:10;transform:translateX(-100%);padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;overflow:auto;border-radius:0 30px 30px 0;box-shadow:0 0 40px rgba(0,0,0,.25)}
body.open #dr{transform:none}body.open #ov{display:block}
#dr a{display:block;padding:13px 14px;border-radius:18px;color:var(--ink);font-weight:600;cursor:pointer}
#dr a.on{background:var(--g);color:#fff;box-shadow:0 6px 14px rgba(47,134,184,.3)}
#tb{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:24px;box-shadow:0 8px 30px rgba(47,134,184,.28);display:flex;justify-content:space-around;padding:8px;z-index:6}
#tb a{flex:1;text-align:center;font-size:11px;color:var(--mut);padding:6px 0;border-radius:16px;cursor:pointer}
#tb a span{display:block;font-size:20px}
#tb a.on{color:var(--acc);background:var(--line);font-weight:700}
#pet{position:fixed;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:7;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#pet img{display:block;height:96px;pointer-events:none;-webkit-user-drag:none}
#pm{position:fixed;left:16px;right:16px;bottom:calc(200px + env(safe-area-inset-bottom,0px));max-width:360px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(47,134,184,.3);z-index:11}
#pm .btn{text-align:center;text-decoration:none;display:block}
#qm{position:fixed;inset:0;background:rgba(23,50,77,.45);display:grid;place-items:center;padding:16px;z-index:12}
</style>
</head>

<script>
const S={members:[],events:[],topics:[],view:'peta',admin:true,uid:null,name:'',db:null};
const $=s=>document.querySelector(s);
function h(t,p,...k){const e=document.createElement(t);for(const a in p||{}){if(a==='onclick')e.onclick=p[a];else if(a==='class')e.className=p[a];else e.setAttribute(a,p[a])}k.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c)});return e}
const ALL=[['peta','🗺️ Peta Wilayah'],['dash','🏠 Dashboard'],['members','👥 Data Anggota'],['absen','📝 Absensi'],['forum','💬 Forum'],['import','📥 Import Database',1],['pesan','📨 Pesan Masuk',1]];
function go(v){S.view=v;S.form=S.detail=null;document.body.classList.remove('open');render()}
$('#mn').onclick=()=>document.body.classList.add('open');
$('#ov').onclick=()=>document.body.classList.remove('open');

function wilayah(){const m={};S.members.forEach(x=>{const w=x.wilayah||'Belum diisi';(m[w]=m[w]||[]).push(x)});return m}
function guard(){return S.db?null:h('p',{class:'warn'},'Database belum aktif. Buka halaman ini dari tautan Artifact.')}

function vDash(){
  const c=(e,t,d,n,v)=>h('button',{class:'card',onclick:()=>go(v)},h('span',{class:'e'},e),h('span',{style:'flex:1'},h('b',{},t),h('small',{},d),h('br'),h('b',{style:'font-size:15px'},n)),'›');
  return [h('h1',{},'Selamat datang'+(S.name?', '+S.name.split(' ')[0]:'')+' 👋'),
    h('p',{class:'sub'},new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})),
    h('div',{class:'stats'},...[['Anggota',S.members.length],['Kegiatan',S.events.length],['Wilayah',Object.keys(wilayah()).length]].map(x=>h('div',{},h('small',{},x[0]),h('b',{},String(x[1]))))),
    c('🗄️','Database','Kelola data anggota komunitas',S.members.length+' anggota','members'),
    c('📋','Absensi','Kegiatan & kehadiran anggota',S.events.length+' kegiatan','absen'),
    c('💬','Forum','Diskusi & komentar anggota',S.topics.length+' topik','forum'),
    c('🗺️','Peta & Wilayah','Sebaran anggota di Jepang',Object.keys(wilayah()).length+' wilayah','peta')];
}
const PERAN=['Anggota','Pengurus'],STATUS=['aktif','nonaktif'];
