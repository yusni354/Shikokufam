<!-- Keamanan dari pihak luar (CSP): hanya asal yang benar-benar dipakai
     aplikasi yang diizinkan — skrip hanya dari berkas sendiri dan jsDelivr
     (pustaka terkunci SRI); data hanya
     ke/dari Supabase proyek ini, ubin peta Esri/GSI/OSM/OpenFreeMap, geocoding
     Nominatim/GSI/HeartRails, dan font Google.
     Skrip & gaya sebaris dari luar daftar ini ditolak peramban.
     child-src blob: = cadangan worker blob: MapLibre untuk mesin
     peramban yang belum mengenal worker-src (ketentuan CSP resmi
     pustaka peta vektor); tidak membuka asal jaringan baru apa pun. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://tiles.openfreemap.org https://*.supabase.co https://*.arcgisonline.com https://cyberjapandata.gsi.go.jp https://tile.openstreetmap.org https://*.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https://shikokufam.vercel.app https://tiles.openfreemap.org https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org https://msearch.gsi.go.jp https://geoapi.heartrails.com; media-src 'self' data: blob: https://*.supabase.co; frame-src 'self'; worker-src 'self' blob:; child-src blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
