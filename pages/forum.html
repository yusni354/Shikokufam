<!-- Forum: semua anggota yang disetujui boleh membaca, membuat topik, dan berkomentar.
     Hapus topik/komentar hanya untuk admin (sesuai RLS); tidak ada ubah topik/komentar
     karena RLS memang tidak memberi izin update untuk forum. -->
<h1>Forum</h1>
<p class="muted" id="forum-count">Memuat forum…</p>
<p id="forum-msg" class="hidden"></p>

<div class="card">
  <label for="forum-search">Cari judul atau isi topik</label>
  <input id="forum-search" type="search" placeholder="Contoh: Pertemuan, Info kerja…" />
</div>

<!-- Formulir topik baru, untuk semua anggota yang disetujui -->
<form id="forum-form" class="card hidden" novalidate>
  <h2>Buat Topik Baru</h2>
  <label for="fp-judul">Judul topik *</label>
  <input id="fp-judul" type="text" required />
  <label for="fp-isi">Isi topik *</label>
  <textarea id="fp-isi" rows="4" required></textarea>
  <p id="forum-form-error" class="error hidden"></p>
  <p>
    <button type="submit">Kirim Topik</button>
    <button id="btn-forum-cancel" type="button" class="secondary">Batal</button>
  </p>
</form>

<p><button id="btn-add-forum" type="button">＋ Buat Topik Baru</button></p>

<!-- Detail satu topik beserta komentarnya -->
<div id="forum-detail" class="card hidden"></div>
<form id="comment-form" class="card hidden" novalidate>
  <h2>Tulis Komentar</h2>
  <label for="fc-isi">Komentar *</label>
  <textarea id="fc-isi" rows="3" required></textarea>
  <p id="comment-form-error" class="error hidden"></p>
  <p><button type="submit">Kirim Komentar</button></p>
</form>

<div id="forum-list"></div>
