<!-- Galeri: semua anggota yang disetujui boleh melihat.
     Tambah/ubah/hapus hanya untuk admin yang disetujui (juga dijaga RLS).
     Foto bisa diunggah ke Supabase Storage (bucket "galeri") atau cukup ditempel tautannya. -->
<h1>Galeri</h1>
<p class="muted" id="gallery-count">Memuat galeri…</p>
<p id="gallery-msg" class="hidden"></p>

<div class="card">
  <label for="gallery-search">Cari judul atau deskripsi foto</label>
  <input id="gallery-search" type="search" placeholder="Contoh: Pertemuan, Piknik…" />
</div>

<!-- Detail foto, muncul saat foto diketuk -->
<div id="gallery-detail" class="card hidden"></div>

<!-- Formulir tambah/ubah foto, hanya untuk admin -->
<form id="gallery-form" class="card hidden" novalidate>
  <h2 id="gallery-form-title">Tambah Foto</h2>
  <label for="g-judul">Judul foto *</label>
  <input id="g-judul" type="text" required />
  <label for="g-deskripsi">Deskripsi</label>
  <textarea id="g-deskripsi" rows="2"></textarea>
  <label for="g-file">Unggah foto dari HP/komputer</label>
  <input id="g-file" type="file" accept="image/*" />
  <p class="muted small">Maksimal 5 MB. Kalau bucket "galeri" belum dibuat di Supabase, unggahan akan gagal — jalankan dulu <code>supabase/storage.sql</code>, atau pakai tautan foto di bawah ini.</p>
  <label for="g-url">Atau tempel tautan foto (URL)</label>
  <input id="g-url" type="url" placeholder="https://…" />
  <p id="gallery-form-error" class="error hidden"></p>
  <p>
    <button type="submit">Simpan Foto</button>
    <button id="btn-gallery-cancel" type="button" class="secondary">Batal</button>
  </p>
</form>

<div id="gallery-admin-actions" class="hidden">
  <button id="btn-add-gallery" type="button">＋ Tambah Foto</button>
</div>

<div id="gallery-list" class="gallery-grid"></div>
