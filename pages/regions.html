<!-- Wilayah: semua anggota yang disetujui boleh melihat.
     Tambah/ubah/hapus hanya untuk admin yang disetujui (juga dijaga RLS).
     Setiap wilayah bisa punya tautan Google My Maps sendiri; tautan viewer
     My Maps akan diubah otomatis menjadi tautan embed saat ditampilkan. -->
<h1>Wilayah</h1>
<p class="muted" id="regions-count">Memuat wilayah…</p>
<p id="regions-msg" class="hidden"></p>

<div class="card">
  <label for="regions-search">Cari nama wilayah atau keterangan</label>
  <input id="regions-search" type="search" placeholder="Contoh: Tokushima, Kagawa…" />
  <label for="regions-filter-prefektur">Prefektur</label>
  <select id="regions-filter-prefektur">
    <option value="">Semua prefektur</option>
    <option>Tokushima</option>
    <option>Kagawa</option>
    <option>Ehime</option>
    <option>Kochi</option>
  </select>
</div>

<!-- Detail satu wilayah: keterangan, peta My Maps, dan daftar anggotanya -->
<div id="region-detail" class="card hidden"></div>

<!-- Formulir tambah/ubah wilayah, hanya untuk admin -->
<form id="region-form" class="card hidden" novalidate>
  <h2 id="region-form-title">Tambah Wilayah</h2>
  <label for="r-nama">Nama wilayah *</label>
  <input id="r-nama" type="text" required placeholder="Contoh: Tokushima-shi" />
  <label for="r-prefektur">Prefektur</label>
  <select id="r-prefektur">
    <option value="">— Pilih —</option>
    <option>Tokushima</option>
    <option>Kagawa</option>
    <option>Ehime</option>
    <option>Kochi</option>
  </select>
  <label for="r-keterangan">Keterangan</label>
  <textarea id="r-keterangan" rows="3"></textarea>
  <label for="r-link">Tautan Google My Maps wilayah ini</label>
  <input id="r-link" type="url" placeholder="https://www.google.com/maps/d/…" />
  <p class="muted small">Boleh tautan viewer My Maps atau tautan embed; aplikasi akan mengubahnya menjadi embed saat ditampilkan. Kosongkan kalau wilayah ini belum punya peta sendiri — peta utama ada di menu Peta Anggota.</p>
  <p id="region-form-error" class="error hidden"></p>
  <p>
    <button type="submit">Simpan Wilayah</button>
    <button id="btn-region-cancel" type="button" class="secondary">Batal</button>
  </p>
</form>

<div id="regions-admin-actions" class="hidden">
  <button id="btn-add-region" type="button">＋ Tambah Wilayah</button>
</div>

<div id="regions-list"></div>
