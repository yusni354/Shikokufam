<!-- Absensi: semua anggota yang disetujui boleh melihat.
     Tambah/ubah/hapus hanya untuk admin yang disetujui (juga dijaga RLS). -->
<h1>Absensi</h1>
<p class="muted" id="attendance-count">Memuat absensi…</p>
<p id="attendance-msg" class="hidden"></p>

<!-- Ringkasan untuk data yang sedang ditampilkan (sesuai saringan) -->
<div class="grid">
  <div class="card stat"><b id="sum-hadir">–</b><span>Hadir</span></div>
  <div class="card stat"><b id="sum-izin">–</b><span>Izin</span></div>
  <div class="card stat"><b id="sum-alpa">–</b><span>Alpa</span></div>
  <div class="card stat"><b id="sum-total">–</b><span>Total Catatan</span></div>
</div>

<div class="card">
  <h2>Saring Riwayat</h2>
  <label for="att-filter-tanggal">Tanggal</label>
  <input id="att-filter-tanggal" type="date" />
  <label for="att-filter-status">Status</label>
  <select id="att-filter-status">
    <option value="">Semua status</option>
    <option>hadir</option>
    <option>izin</option>
    <option>alpa</option>
  </select>
  <label for="att-search">Cari nama anggota atau kegiatan</label>
  <input id="att-search" type="search" placeholder="Contoh: Yusni, Pengajian…" />
  <p><button id="btn-clear-filter" type="button" class="secondary">Tampilkan Semua</button></p>
</div>

<!-- Formulir catat/ubah absensi, hanya untuk admin -->
<form id="attendance-form" class="card hidden" novalidate>
  <h2 id="attendance-form-title">Catat Absensi</h2>
  <label for="a-anggota">Anggota *</label>
  <select id="a-anggota" required>
    <option value="">— Pilih anggota —</option>
  </select>
  <label for="a-tanggal">Tanggal *</label>
  <input id="a-tanggal" type="date" required />
  <label for="a-status">Status *</label>
  <select id="a-status" required>
    <option value="">— Pilih —</option>
    <option>hadir</option>
    <option>izin</option>
    <option>alpa</option>
  </select>
  <label for="a-kegiatan">Kegiatan</label>
  <input id="a-kegiatan" type="text" placeholder="Contoh: Pertemuan bulanan, Pengajian" />
  <label for="a-keterangan">Keterangan</label>
  <textarea id="a-keterangan" rows="2"></textarea>
  <p id="attendance-form-error" class="error hidden"></p>
  <p>
    <button type="submit">Simpan Absensi</button>
    <button id="btn-att-cancel" type="button" class="secondary">Batal</button>
  </p>
</form>

<div id="attendance-admin-actions" class="hidden">
  <button id="btn-add-attendance" type="button">＋ Catat Absensi</button>
</div>

<div id="attendance-list"></div>
