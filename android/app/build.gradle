plugins {
    id 'com.android.application'
}

def webAppRoot = rootProject.projectDir.parentFile
def webAssetsDir = layout.buildDirectory.dir('generated/webappAssets')

android {
    namespace 'id.shikokufamily.app'
    compileSdk 36

    defaultConfig {
        applicationId 'id.shikokufamily.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    sourceSets {
        main.assets.srcDir(webAssetsDir)
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.10.1'
}

tasks.register('copyWebApp', Copy) {
    from(webAppRoot) {
        include 'index.html'
        include 'assets/**'
    }
    into(webAssetsDir)
}

tasks.named('preBuild').configure {
    dependsOn('copyWebApp')
}
